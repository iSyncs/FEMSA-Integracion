# Actualizaciones automáticas. Cuando llegue el código de cada parte, agrega aquí su carpeta
# (frontend, backend-auditoria, backend-riesgos) con el mismo bloque de "npm".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
